## 四、超时与重试配置

### 4.1 超时时间参考

| 任务类型 | 建议超时时间 | 说明 |
|----------|--------------|------|
| 简单ETL | 30分钟 | 数据量<100万 |
| 复杂ETL | 2小时 | 多表JOIN/大表处理 |
| 报表生成 | 1小时 | 图表渲染时间 |
| 数据同步 | 3小时 | 全量数据同步 |
| Python处理 | 1小时 | 数据转换逻辑 |

### 4.2 重试配置参考

| 任务类型 | 重试次数 | 重试间隔 | 适用场景 |
|----------|----------|----------|----------|
| 网络任务 | 3次 | 5分钟 | 依赖外部API |
| 数据库任务 | 2次 | 10分钟 | 数据库连接 |
| 文件任务 | 3次 | 5分钟 | 文件读写 |
| 计算任务 | 1次 | 立即 | 计算逻辑错误不重试 |

---

## 五、告警配置规则

### 5.1 告警触发条件

| 告警类型 | 触发条件 | 严重程度 |
|----------|----------|----------|
| 执行失败 | 任务返回非0 | 高 |
| 执行超时 | 超过超时阈值 | 高 |
| 运行时长异常 | 超过平均时长2倍 | 中 |
| 数据量异常 | 与昨日差异>50% | 中 |
| 上游失败 | 依赖任务失败 | 高 |

### 5.2 通知方式

| 方式 | 适用场景 | 配置参数 |
|------|----------|----------|
| 邮件 | 重要任务失败 | 邮箱地址 |
| 钉钉 | 实时通知 | Webhook URL |
| 短信 | 紧急告警 | 手机号 |
| 电话 | P0级故障 | 手机号 |

---

## 六、常见调度问题处理

| 问题 | 原因 | 解决方案 |
|------|------|----------|
| 任务延迟 | 上游数据晚到 | 设置等待+重跑 |
| 任务堆积 | 调度过密 | 调整周期或并行 |
| 重复执行 | 重试+手动触发 | 使用锁机制 |
| 数据丢失 | 任务间未等待 | 添加依赖检查 |
