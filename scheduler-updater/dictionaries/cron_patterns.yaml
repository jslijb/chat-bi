## 三、调度系统适配

### 3.1 OpenClaw

| 命令 | 用途 |
|------|------|
| `openclaw cron list` | 列出所有任务 |
| `openclaw cron add` | 新增任务 |
| `openclaw cron update` | 更新任务 |
| `openclaw cron remove` | 删除任务 |
| `openclaw cron runs` | 查看执行记录 |
| `openclaw cron log` | 查看执行日志 |

### 3.2 Airflow

| 命令 | 用途 |
|------|------|
| `airflow dags list` | 列出所有DAG |
| `airflow tasks list {dag_id}` | 列出DAG中的任务 |
| `airflow dags trigger {dag_id}` | 手动触发DAG |
| `airflow scheduler` | 启动scheduler |
| `airflow webserver` | 启动Web界面 |

### 3.3 DolphinScheduler

| 命令/接口 | 用途 |
|-----------|------|
| 创建工作流 | API调用 |
| 查看任务状态 | Web UI |
| 手动执行 | 运维平台 |

