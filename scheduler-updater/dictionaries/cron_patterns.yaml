## 二、数据依赖关系

### 2.1 标准依赖链

```
ODS (数据接入) → DWD (明细层) → DWS (汇总层) → ADS (应用层)
    ↓                ↓              ↓              ↓
  接入任务        DWD任务        DWS任务        报表任务
```

### 2.2 常见依赖模式

| 上游任务 | 下游任务 | 等待时间 | 说明 |
|----------|----------|----------|------|
| ods数据接入 | dwd任务 | >=30分钟 | 等待数据接入完成 |
| dwd任务 | dws任务 | >=1小时 | 等待明细层完成 |
| dws任务 | ads任务 | >=30分钟 | 等待汇总层完成 |

