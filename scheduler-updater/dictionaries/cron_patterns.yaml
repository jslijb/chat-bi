# 调度配置词库

version: 1.0.0
description: 常见调度场景与配置模式映射

---

## 一、调度周期模式

### 1.1 实时/准实时任务

| 业务场景 | 推荐周期 | Cron表达式 | 说明 |
|----------|----------|------------|------|
| 实时数据接入 | */5分钟 | `*/5 * * * *` | 高频实时 |
| 准实时处理 | */15分钟 | `*/15 * * * *` | 准实时 |
| 快速报表 | */30分钟 | `*/30 * * * *` | 快速响应 |

### 1.2 日级任务

| 业务场景 | 推荐周期 | Cron表达式 | 说明 |
|----------|----------|------------|------|
| T+1批处理 | 每日凌晨2点 | `0 2 * * *` | 标准日批处理 |
| T+0批处理 | 每日23点 | `0 23 * * *` | 当天数据处理 |
| 早报数据 | 每日8点 | `0 8 * * *` | 早间报表 |
| 晚报数据 | 每日20点 | `0 20 * * *` | 晚间报表 |
| 夜宵档处理 | 每日3点 | `0 3 * * *` | 补充处理 |

### 1.3 周级任务

| 业务场景 | 推荐周期 | Cron表达式 | 说明 |
|----------|----------|------------|------|
| 周一处理 | 每周一9点 | `0 9 * * 1` | 周数据汇总 |
| 周报表 | 每周一8点 | `0 8 * * 1` | 周度分析 |

### 1.4 月级任务

| 业务场景 | 推荐周期 | Cron表达式 | 说明 |
|----------|----------|------------|------|
| 月初处理 | 每月1号2点 | `0 2 1 * *` | 月数据汇总 |
| 月末处理 | 每月最后一天23点 | `0 23 L * *` | 月度关账 |
| 月报表 | 每月1号8点 | `0 8 1 * *` | 月度报告 |

