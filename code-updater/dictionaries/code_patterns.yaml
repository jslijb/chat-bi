# 代码变更模式词库

version: 1.0.0
description: 常见代码变更类型与对应的修改模式映射

---

## 一、DDL变更模式

### 1.1 新增字段

| 变更类型 | 关键词 | 修改模式 | 示例 |
|----------|--------|----------|------|
| 新增普通字段 | "增加字段" | ALTER TABLE ADD | `ALTER TABLE xxx ADD COLUMN yyy VARCHAR(100);` |
| 新增分区字段 | "增加分区" | ALTER TABLE ADD PARTITION | 需要重写分区DDL |
| 新增外键 | "增加关联" | ALTER TABLE ADD CONSTRAINT | `ALTER TABLE xxx ADD FOREIGN KEY (yyy_id);` |

### 1.2 修改字段

| 变更类型 | 关键词 | 修改模式 | 示例 |
|----------|--------|----------|------|
| 修改字段类型 | "修改类型" | ALTER TABLE MODIFY | `ALTER TABLE xxx MODIFY yyy INT;` |
| 修改字段长度 | "扩大长度" | ALTER TABLE MODIFY | `ALTER TABLE xxx MODIFY yyy VARCHAR(200);` |
| 修改字段注释 | "更新注释" | COMMENT ON COLUMN | `COMMENT ON COLUMN xxx.yyy IS '新注释';` |
| 修改默认值 | "修改默认值" | ALTER TABLE ALTER | `ALTER TABLE xxx ALTER yyy SET DEFAULT 0;` |

### 1.3 删除字段

| 变更类型 | 关键词 | 修改模式 | 风险等级 |
|----------|--------|----------|----------|
| 删除普通字段 | "删除字段" | ALTER TABLE DROP | 高 |
| 删除分区字段 | "移除分区" | - | 高（需重写） |

---

## 二、ETL变更模式

### 2.1 SQL ETL常见变更

| 变更类型 | 修改位置 | 修改模式 |
|----------|----------|----------|
| 新增SELECT字段 | SELECT子句 | 追加新字段 |
| 修改WHERE条件 | WHERE子句 | 更新过滤条件 |
| 修改JOIN条件 | JOIN子句 | 更新连接条件 |
| 修改GROUP BY | GROUP BY子句 | 添加或移除分组字段 |
| 修改聚合函数 | SELECT子句 | 更新聚合表达式 |
| 新增表引用 | FROM/JOIN子句 | 添加新表 |

### 2.2 Python ETL常见变更

| 变更类型 | 修改位置 | 修改模式 |
|----------|----------|----------|
| 新增数据源 | 数据读取 | 添加read_parquet/sql |
| 修改转换逻辑 | 数据转换 | 更新transform函数 |
| 新增输出字段 | 数据写入 | 添加新列 |
| 修改输出表 | 数据写入 | 更新write方法 |

---

## 三、配置变更模式

### 3.1 requirements.txt

```yaml
变更类型:
  - 新增需求条目
  - 废弃旧需求条目 [DEPRECATED]
  - 修改需求版本号
```

### 3.2 data_lineage.json

```yaml
变更类型:
  - 新增字段血缘
  - 更新字段血缘
  - 删除字段血缘
```

### 3.3 调度配置

```yaml
变更类型:
  - 新增调度任务
  - 修改调度周期
  - 更新任务依赖
  - 删除调度任务
```

---

## 四、代码质量检查规则

### 4.1 SQL规范检查

| 检查项 | 规则 | 严重程度 |
|--------|------|----------|
| 主键 | 必须有主键或唯一键 | 错误 |
| 注释 | 字段必须有注释 | 警告 |
| 数据类型 | 避免使用TEXT/BLOB | 警告 |
| NULL处理 | 聚合函数需考虑NULL | 警告 |

### 4.2 Python规范检查

| 检查项 | 规则 | 严重程度 |
|--------|------|----------|
| 导入 | 禁止 import * | 警告 |
| 异常处理 | 必须有异常捕获 | 错误 |
| 日志 | 必须有日志记录 | 警告 |
| 类型注解 | 推荐添加类型注解 | 信息 |

---

## 五、风险识别规则

### 5.1 高风险变更

| 变更类型 | 风险说明 | 缓解措施 |
|----------|----------|----------|
| 删除字段 | 可能导致下游ETL失败 | 确认无下游依赖 |
| 修改口径 | 可能导致数据不一致 | 保留旧版本，新旧双跑 |
| 删除表 | 不可逆操作 | 确认备份 |
| 修改分区 | 可能丢失数据 | 确认分区策略 |

### 5.2 变更前检查清单

- [ ] 确认无下游ETL依赖该字段/表
- [ ] 确认测试环境验证通过
- [ ] 确认回滚方案可行
- [ ] 确认业务方知情并确认
- [ ] 确认变更时间窗口
