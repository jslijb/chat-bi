# 需求变更类型词库

version: 1.0.0
description: 常见需求变更类型与影响等级的映射规则

---

## 一、变更类型识别

### 1.1 新增类关键词

| 关键词 | 变更类型 | 默认影响等级 | 说明 |
|--------|----------|--------------|------|
| 新增 | ADD | 中(M) | 新增字段或表 |
| 添加 | ADD | 中(M) | 新增维度或指标 |
| 引入 | ADD | 中(M) | 新增数据来源 |
| 增加 | ADD | 中(M) | 扩展现有指标 |
| 补充 | ADD | 低(L) | 补充可选字段 |

### 1.2 修改类关键词

| 关键词 | 变更类型 | 默认影响等级 | 说明 |
|--------|----------|--------------|------|
| 修改 | MOD | 高(H) | 修改口径 |
| 调整 | MOD | 中(M) | 调整计算逻辑 |
| 变更 | MOD | 高(H) | 核心指标变更 |
| 优化 | MOD | 低(L) | 性能或精度优化 |
| 纠正 | MOD | 中(M) | 纠正错误口径 |
| 统一 | MOD | 高(H) | 统一多方口径 |

### 1.3 删除类关键词

| 关键词 | 变更类型 | 默认影响等级 | 说明 |
|--------|----------|--------------|------|
| 删除 | DEL | 高(H) | 删除字段（高风险） |
| 移除 | DEL | 高(H) | 移除依赖 |
| 废弃 | DEP | 低(L) | 标记废弃但保留 |

---

## 二、口径变更特征词

### 2.1 分子分母变更
- "从...改为..." → MOD类型
- "计算方式调整" → MOD类型
- "重新定义" → MOD类型

### 2.2 时间窗口变更
- "从T+1改为T+0" → 严重(S)
- "统计周期调整" → 高(H)
- "延迟生效" → 中(M)

### 2.3 口径细化
- "增加限制条件" → 中(M)
- "排除XX情况" → 中(M)
- "区分XX场景" → 高(H)

---

## 三、数据源变更

| 变更类型 | 关键词 | 影响等级 | 下游影响 |
|----------|--------|----------|----------|
| 新增ODS表 | "新增数据源" | 中(M) | ETL需新增读取 |
| 替换ODS表 | "换表" | 严重(S) | 数据可能不一致 |
| 字段来源变更 | "改从XX表取数" | 高(H) | ETL逻辑需修改 |
| 表结构变更 | "加字段" | 中(M) | DDL + ETL |

---

## 四、影响等级调整规则

### 上调等级的情况
- 涉及历史数据回溯 → +1级
- 涉及财务报表指标 → +1级
- 影响多个下游系统 → +1级
- 变更口径与监管相关 → 严重(S)

### 下调等级的情况
- 仅为新增可选字段 → -1级
- 仅影响测试环境 → -1级
- 有完善的回滚方案 → -1级

---

## 五、血缘追溯规则

### 表级血缘追溯
```
ADS表变更 → 查找DWS依赖 → 查找DWD依赖 → 查找ODS来源
```

### ETL级血缘追溯
```
ETL脚本变更 → 查找输出表 → 查找下游ETL → 查找调度依赖
```

### 字段级血缘追溯
```
字段变更 → 查找使用该字段的ETL → 查找引用该ETL的报表
```

---

## 六、风险识别关键词

| 关键词 | 风险类型 | 建议操作 |
|--------|----------|----------|
| 回溯 | 历史数据重新计算 | 提前告知业务，准备回滚方案 |
| 口径 | 核心指标变更 | 多方评审，确认生效时间 |
| 切换 | 系统切换 | 分批切换，准备回退 |
| 停机 | 需停机维护 | 安排维护窗口 |
| 兼容 | 需兼容新旧逻辑 | 双跑验证后切换 |
