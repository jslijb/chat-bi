    columns:
      rel_id:
        type: BIGINT
        comment: 关系ID
        nullable: false
        auto_increment: true
      agent_id:
        type: BIGINT
        comment: 代理人ID
        nullable: false
      user_id:
        type: BIGINT
        comment: 客户用户ID
        nullable: false
      bind_time:
        type: DATETIME
        comment: 绑定时间
        nullable: false
        default: CURRENT_TIMESTAMP
      unbind_time:
        type: DATETIME
        comment: 解绑时间
        nullable: true
        default: null
      source:
        type: VARCHAR(32)
        comment: 绑定来源
        nullable: true
        default: null
  pingan_insurance_blacklist:
    catalog: paimon
    database: cx_ods_safe
    layer: ODS
    comment: 黑名单表
    primary_key:
    - id
    columns:
      id:
        type: BIGINT
        comment: ID
        nullable: false
        auto_increment: true
      target_type:
        type: TINYINT
        comment: 对象类型：1-用户，2-车辆，3-企业
        nullable: false
      target_id:
        type: VARCHAR(64)
        comment: 对象ID（user_id/vehicle_id/enterprise_id）
        nullable: false
      reason:
        type: VARCHAR(256)
        comment: 列入原因
        nullable: false
      operator:
        type: VARCHAR(64)
        comment: 操作人
        nullable: false
      add_time:
        type: DATETIME
        comment: 列入时间
        nullable: false
        default: CURRENT_TIMESTAMP
      expire_time:
        type: DATETIME
        comment: 过期时间（NULL表示永久）
        nullable: true
        default: null
      status:
        type: TINYINT
        comment: 状态：1-生效，0-已解除
        nullable: false
        default: 1
      remove_time:
        type: DATETIME
        comment: 解除时间
        nullable: true
        default: null
