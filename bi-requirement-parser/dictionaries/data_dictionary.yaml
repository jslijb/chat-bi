      enterprise_id:
        type: BIGINT
        comment: 企业ID
        nullable: false
      user_id:
        type: BIGINT
        comment: 用户ID
        nullable: false
      role:
        type: TINYINT
        comment: 角色：1-管理员，2-员工，3-经办人
        nullable: false
      bind_time:
        type: DATETIME
        comment: 绑定时间
        nullable: false
        default: CURRENT_TIMESTAMP
      unbind_time:
        type: DATETIME
        comment: 解绑时间
        nullable: true
        default: null
      status:
        type: TINYINT
        comment: 状态：1-生效，0-失效
        nullable: false
