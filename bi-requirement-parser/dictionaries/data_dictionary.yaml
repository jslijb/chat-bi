        nullable: true
        default: null
      address:
        type: VARCHAR(256)
        comment: 注册地址
        nullable: true
        default: null
      industry:
        type: VARCHAR(64)
        comment: 所属行业
        nullable: true
        default: null
      status:
        type: TINYINT
        comment: 状态：0-冻结，1-正常
        nullable: false
        default: 1
      is_deleted:
        type: TINYINT
        comment: 逻辑删除标记
        nullable: false
        default: 0
      create_time:
        type: DATETIME
        comment: 创建时间
        nullable: false
        default: CURRENT_TIMESTAMP
      update_time:
        type: DATETIME
        comment: 更新时间
        nullable: false
        default: CURRENT_TIMESTAMP
  pingan_insurance_enterprise_user:
    catalog: paimon
    database: cx_ods_safe
