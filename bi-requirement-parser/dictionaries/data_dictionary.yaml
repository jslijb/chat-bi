      user_id:
        type: BIGINT
        comment: 关联用户ID
        nullable: false
      agent_code:
        type: VARCHAR(32)
        comment: 代理人编号
        nullable: false
      level:
        type: TINYINT
        comment: 职级：1-普通，2-主管，3-经理
        nullable: false
        default: 1
      org_id:
        type: BIGINT
        comment: 所属机构ID
        nullable: false
      hire_date:
        type: DATE
        comment: 入职日期
        nullable: false
      status:
        type: TINYINT
        comment: 状态：1-在职，0-离职
        nullable: false
        default: 1
      create_time:
        type: DATETIME
        comment: 创建时间
        nullable: false
        default: CURRENT_TIMESTAMP
      update_time:
        type: DATETIME
        comment: 更新时间
        nullable: false
        default: CURRENT_TIMESTAMP
  pingan_insurance_agent_customer:
    catalog: paimon
    database: cx_ods_safe
