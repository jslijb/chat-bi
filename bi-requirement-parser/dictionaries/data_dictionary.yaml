tables:
  pingan_insurance_user:
    catalog: paimon
    database: cx_ods_safe
    layer: ODS
    comment: 个人用户主表
    primary_key:
    - user_id
    columns:
      user_id:
        type: BIGINT
        comment: 用户ID
        nullable: false
        auto_increment: true
      mobile:
        type: VARCHAR(20)
        comment: 手机号
        nullable: false
      id_type:
        type: TINYINT
        comment: 证件类型：1-身份证，2-护照，3-军官证，...
        nullable: false
        default: 1
      id_no:
        type: VARCHAR(32)
        comment: 证件号码（加密存储）
        nullable: false
      real_name:
        type: VARCHAR(64)
        comment: 真实姓名
        nullable: true
        default: null
      nickname:
        type: VARCHAR(64)
        comment: 昵称
        nullable: true
        default: null
      gender:
        type: TINYINT
        comment: 性别：0-未知，1-男，2-女
        nullable: true
        default: null
      birth_date:
        type: DATE
        comment: 出生日期
        nullable: true
        default: null
      register_time:
        type: DATETIME
        comment: 注册时间
        nullable: false
        default: CURRENT_TIMESTAMP
      last_login_time:
        type: DATETIME
        comment: 最后登录时间
        nullable: true
        default: null
      status:
        type: TINYINT
        comment: 状态：0-冻结，1-正常，2-注销
        nullable: false
        default: 1
      is_deleted:
        type: TINYINT
        comment: 逻辑删除标记：0-未删除，1-已删除
        nullable: false
        default: 0
      create_time:
        type: DATETIME
        comment: 创建时间
        nullable: false
        default: CURRENT_TIMESTAMP
      update_time:
        type: DATETIME
        comment: 更新时间
        nullable: false
        default: CURRENT_TIMESTAMP
  pingan_insurance_user_auth:
    catalog: paimon
    database: cx_ods_safe
    layer: ODS
    comment: 用户认证信息表
    primary_key:
    - auth_id
    columns:
      auth_id:
        type: BIGINT
        comment: 认证ID
        nullable: false
        auto_increment: true
      user_id:
        type: BIGINT
        comment: 用户ID
        nullable: false
      password_salt:
        type: VARCHAR(32)
        comment: 密码盐
        nullable: false
      password_hash:
        type: VARCHAR(128)
        comment: 密码哈希
        nullable: false
      wechat_openid:
        type: VARCHAR(64)
        comment: 微信openid
        nullable: true
        default: null
      alipay_userid:
        type: VARCHAR(64)
        comment: 支付宝用户ID
        nullable: true
        default: null
      unionid:
        type: VARCHAR(64)
        comment: 微信unionid
        nullable: true
        default: null
      apple_id:
        type: VARCHAR(64)
        comment: Apple ID
        nullable: true
        default: null
      create_time:
        type: DATETIME
        comment: 创建时间
        nullable: false
        default: CURRENT_TIMESTAMP
      update_time:
        type: DATETIME
        comment: 更新时间
        nullable: false
        default: CURRENT_TIMESTAMP
  pingan_insurance_user_profile:
    catalog: paimon
    database: cx_ods_safe
    layer: ODS
    comment: 用户扩展资料表
    primary_key:
    - profile_id
    columns:
      profile_id:
        type: BIGINT
        comment: 资料ID
        nullable: false
        auto_increment: true
      user_id:
        type: BIGINT
        comment: 用户ID
        nullable: false
      occupation:
        type: VARCHAR(64)
        comment: 职业
        nullable: true
        default: null
      education:
        type: VARCHAR(32)
        comment: 学历
        nullable: true
        default: null
      annual_income:
        type: INT
        comment: 年收入（元）
        nullable: true
        default: null
      household_register:
        type: VARCHAR(128)
        comment: 户籍地址
        nullable: true
        default: null
      address:
        type: VARCHAR(256)
        comment: 现住址
        nullable: true
        default: null
      marital_status:
        type: TINYINT
        comment: 婚姻状况：1-未婚，2-已婚，3-离异，4-丧偶
        nullable: true
        default: null
      create_time:
        type: DATETIME
        comment: 创建时间
        nullable: false
        default: CURRENT_TIMESTAMP
      update_time:
        type: DATETIME
        comment: 更新时间
        nullable: false
        default: CURRENT_TIMESTAMP
  pingan_insurance_user_vehicle:
    catalog: paimon
    database: cx_ods_safe
    layer: ODS
    comment: 用户车辆档案表
    primary_key:
    - vehicle_id
    columns:
      vehicle_id:
        type: BIGINT
        comment: 车辆档案ID
        nullable: false
        auto_increment: true
      user_id:
        type: BIGINT
        comment: 车主用户ID
        nullable: false
      license_plate:
        type: VARCHAR(16)
        comment: 车牌号
        nullable: false
      vin:
        type: VARCHAR(17)
        comment: 车架号(VIN)
        nullable: false
      brand:
        type: VARCHAR(32)
        comment: 品牌
        nullable: false
      model:
        type: VARCHAR(64)
        comment: 车型
        nullable: false
      model_code:
        type: VARCHAR(32)
        comment: 车型编码（关联定价）
        nullable: true
        default: null
      register_date:
        type: DATE
        comment: 首次上牌日期
        nullable: false
      first_register_date:
        type: DATE
        comment: 车辆首次登记日期（新车/二手）
        nullable: true
        default: null
      engine_no:
        type: VARCHAR(32)
        comment: 发动机号
        nullable: true
        default: null
      seat_count:
        type: TINYINT
        comment: 核定载客数
        nullable: true
        default: null
      vehicle_type:
        type: TINYINT
        comment: 车辆类型：1-私家车，2-企业车，3-营运车
        nullable: true
        default: null
      is_deleted:
        type: TINYINT
        comment: 逻辑删除标记
        nullable: false
        default: 0
      create_time:
        type: DATETIME
        comment: 创建时间
        nullable: false
        default: CURRENT_TIMESTAMP
      update_time:
        type: DATETIME
        comment: 更新时间
        nullable: false
        default: CURRENT_TIMESTAMP
  pingan_insurance_user_risk_score:
    catalog: paimon
    database: cx_ods_safe
    layer: ODS
    comment: 用户风险评分表（历史记录）
    primary_key:
    - score_id
    columns:
      score_id:
        type: BIGINT
        comment: 评分ID
        nullable: false
        auto_increment: true
      user_id:
        type: BIGINT
        comment: 用户ID
        nullable: false
      score:
        type: DECIMAL(5,2)
        comment: 风险评分（0-100）
        nullable: false
      score_date:
        type: DATE
        comment: 评分日期
        nullable: false
      model_version:
        type: VARCHAR(32)
        comment: 模型版本
        nullable: false
      create_time:
        type: DATETIME
        comment: 创建时间
        nullable: false
        default: CURRENT_TIMESTAMP
  pingan_insurance_enterprise:
    catalog: paimon
    database: cx_ods_safe
    layer: ODS
    comment: 企业客户主表
    primary_key:
