version: 1.0.0
description: "业务模糊词汇 → 可量化指标的标准映射规则"

quantity_scale:
  - term: "很多用户"
    rule: "人数 > N"
    default_threshold: ">1000人"
    confirm: "待业务确认阈值"
  - term: "大量用户"
    rule: "人数 > N"
    default_threshold: ">5000人"
    confirm: "待业务确认阈值"
  - term: "不少"
    rule: "人数 > N"
    default_threshold: ">100人"
    confirm: "待业务确认阈值"
  - term: "少量"
    rule: "人数 < N"
    default_threshold: "<50人"
    confirm: "待业务确认阈值"
  - term: "个别"
    rule: "人数 <= N"
    default_threshold: "<=10人"
    confirm: "待业务确认阈值"
  - term: "大多数"
    rule: "比例 >= N%"
    default_threshold: ">=70%"
    confirm: "待业务确认阈值"
  - term: "少数"
    rule: "比例 < N%"
    default_threshold: "<30%"
    confirm: "待业务确认阈值"
  - term: "普遍"
    rule: "比例 >= N%"
    default_threshold: ">=50%"
    confirm: "待业务确认阈值"
  - term: "部分"
    rule: "比例 >= N%"
    default_threshold: ">=20%"
    confirm: "待业务确认阈值"
  - term: "整体"
    rule: "全部/100%"
    default_threshold: "100%"
    confirm: "固定值"

time:
  - term: "最近"
    rule: "近N天"
    default_threshold: "近30天"
    confirm: "待业务确认"
  - term: "近期"
    rule: "近N天"
    default_threshold: "近30天"
    confirm: "待业务确认"
  - term: "前不久"
    rule: "近N天"
    default_threshold: "近7天"
    confirm: "待业务确认"
  - term: "长期"
    rule: ">= N个月"
    default_threshold: ">=3个月"
    confirm: "待业务确认"
  - term: "短期"
    rule: "< N个月"
    default_threshold: "<1个月"
    confirm: "待业务确认"
  - term: "高峰期"
    rule: "特定时段"
    default_threshold: "9:00-11:00, 14:00-17:00"
    confirm: "待业务确认"
  - term: "平时"
    rule: "非高峰期"
    default_threshold: "其他时段"
    confirm: "固定值"

trend_growth:
  - term: "增长好"
    rule: "环比增长 >= N%"
    default_threshold: ">=5%"
    confirm: "待业务确认阈值"
  - term: "表现好"
    rule: "指标值 >= N"
    default_threshold: "按指标定"
    confirm: "待业务确认阈值"
  - term: "不错"
    rule: "指标值 >= N"
    default_threshold: "按指标定"
    confirm: "待业务确认阈值"
  - term: "下滑"
    rule: "环比增长 < 0%"
    default_threshold: "<0%"
    confirm: "固定值"
  - term: "下跌"
    rule: "环比增长 < 0%"
    default_threshold: "<0%"
    confirm: "固定值"
  - term: "下降"
    rule: "环比增长 < N%"
    default_threshold: "待确认"
    confirm: "待业务确认阈值"
  - term: "大幅增长"
    rule: "环比增长 >= N%"
    default_threshold: ">=20%"
    confirm: "待业务确认阈值"
  - term: "小幅增长"
    rule: "环比增长 >= N%"
    default_threshold: "0%-5%"
    confirm: "固定值"
  - term: "暴增"
    rule: "环比增长 >= N%"
    default_threshold: ">=100%"
    confirm: "待业务确认阈值"
  - term: "骤降"
    rule: "环比下降 >= N%"
    default_threshold: ">=50%"
    confirm: "待业务确认阈值"
  - term: "稳定"
    rule: "波动范围 <= N%"
    default_threshold: "<=5%"
    confirm: "待业务确认阈值"
  - term: "波动大"
    rule: "波动范围 >= N%"
    default_threshold: ">=20%"
    confirm: "待业务确认阈值"

value_quality:
  - term: "高价值"
    rule: "金额 >= N分"
    default_threshold: ">=5000分"
    confirm: "待业务确认阈值"
  - term: "优质"
    rule: "金额 >= N分"
    default_threshold: "按业务定"
    confirm: "待业务确认阈值"
  - term: "头部"
    rule: "排名前N%"
    default_threshold: "<=10%"
    confirm: "待业务确认阈值"
  - term: "低价值"
    rule: "金额 < N分"
    default_threshold: "<1000分"
    confirm: "待业务确认阈值"
  - term: "尾部"
    rule: "排名后N%"
    default_threshold: ">=80%"
    confirm: "待业务确认阈值"
  - term: "中等"
    rule: "金额/排名范围"
    default_threshold: "20%-80%"
    confirm: "待业务确认"
  - term: "核心用户"
    rule: "综合评分 >= N"
    default_threshold: "按模型定"
    confirm: "待业务确认阈值"
  - term: "普通用户"
    rule: "综合评分 < N"
    default_threshold: "按模型定"
    confirm: "待业务确认阈值"

activity_behavior:
  - term: "活跃"
    rule: "近N天有操作 >= X次"
    default_threshold: "近30天>=3次"
    confirm: "待业务确认"
  - term: "不活跃"
    rule: "近N天有操作 < X次"
    default_threshold: "近30天<3次"
    confirm: "待业务确认"
  - term: "沉默用户"
    rule: "近N天无任何操作"
    default_threshold: "近30天=0次"
    confirm: "固定值"
  - term: "流失用户"
    rule: "超过N天无操作"
    default_threshold: ">60天"
    confirm: "待业务确认"
  - term: "新用户"
    rule: "注册 <= N天"
    default_threshold: "<=7天"
    confirm: "待业务确认"
  - term: "老用户"
    rule: "注册 > N天"
    default_threshold: ">180天"
    confirm: "待业务确认"
  - term: "高频用户"
    rule: "每月操作 >= N次"
    default_threshold: ">=20次"
    confirm: "待业务确认阈值"
  - term: "低频用户"
    rule: "每月操作 < N次"
    default_threshold: "<5次"
    confirm: "待业务确认阈值"
  - term: "首次"
    rule: "行为发生1次"
    default_threshold: "=1次"
    confirm: "固定值"
  - term: "复购"
    rule: "购买 >= N次"
    default_threshold: ">=2次"
    confirm: "待业务确认阈值"

speed_efficiency:
  - term: "很快"
    rule: "耗时 <= N秒/分"
    default_threshold: "<=3秒"
    confirm: "待业务确认阈值"
  - term: "很慢"
    rule: "耗时 > N秒/分"
    default_threshold: ">10秒"
    confirm: "待业务确认阈值"
  - term: "及时(耗时)"
    rule: "耗时 <= N秒/分"
    default_threshold: "<=5秒"
    confirm: "待业务确认阈值"
  - term: "延迟"
    rule: "耗时 > N秒/分"
    default_threshold: ">30秒"
    confirm: "待业务确认阈值"
  - term: "及时(达成率)"
    rule: "时效达成率 >= N%"
    default_threshold: ">=95%"
    confirm: "待业务确认阈值"

frequency:
  - term: "经常"
    rule: "出现频率 >= N次/月"
    default_threshold: ">=10次/月"
    confirm: "待业务确认阈值"
  - term: "偶尔"
    rule: "出现频率 < N次/月"
    default_threshold: "<3次/月"
    confirm: "待业务确认阈值"
  - term: "频繁"
    rule: "出现频率 >= N次/天"
    default_threshold: ">=50次/天"
    confirm: "待业务确认阈值"
  - term: "很少"
    rule: "出现频率 < N次/月"
    default_threshold: "<1次/月"
    confirm: "待业务确认阈值"

comparison:
  - term: "比...高"
    rule: "差异 >= N%"
    default_threshold: ">=5%"
    confirm: "待业务确认阈值"
  - term: "比...低"
    rule: "差异 < 0%"
    default_threshold: "<0%"
    confirm: "固定值"
  - term: "高于行业"
    rule: "比基准 >= N%"
    default_threshold: "行业基准"
    confirm: "待业务确认"
  - term: "低于行业"
    rule: "比基准 < N%"
    default_threshold: "行业基准"
    confirm: "待业务确认"
  - term: "超过"
    rule: "达到或超过N"
    default_threshold: "目标值"
    confirm: "待业务确认阈值"
  - term: "落后"
    rule: "低于N"
    default_threshold: "目标值"
    confirm: "待业务确认阈值"
  - term: "持平"
    rule: "差异在 ±N%内"
    default_threshold: "±5%"
    confirm: "待业务确认阈值"

probability:
  - term: "很可能"
    rule: "概率 >= N%"
    default_threshold: ">=80%"
    confirm: "待业务确认阈值"
  - term: "可能"
    rule: "概率 >= N%"
    default_threshold: ">=50%"
    confirm: "待业务确认阈值"
  - term: "不太可能"
    rule: "概率 < N%"
    default_threshold: "<20%"
    confirm: "待业务确认阈值"
  - term: "几乎一定"
    rule: "概率 >= N%"
    default_threshold: ">=95%"
    confirm: "待业务确认阈值"
  - term: "极少数"
    rule: "概率 < N%"
    default_threshold: "<5%"
    confirm: "待业务确认阈值"

unit_rules:
  - type: "金额"
    unit: "分（元 × 100）"
    note: "避免小数精度问题"
  - type: "时间(时长)"
    unit: "秒/分/小时/天"
    note: "根据场景选择"
  - type: "比率"
    unit: "%（保留2位小数）"
    note: "百分比形式"
  - type: "人数"
    unit: "人"
    note: "整数"
  - type: "次数"
    unit: "次"
    note: "整数"
  - type: "转化率"
    unit: "%（保留4位小数）"
    note: "精度要求高"
  - type: "天数"
    unit: "天"
    note: "整数"

usage_notes:
  - "优先级：业务方明确给出阈值时，以业务方为准；未给出时，使用默认阈值并标记待业务确认"
  - "组合使用：多个模糊词可叠加，如'最近很多用户' → 近7天 + >1000人"
  - "行业适配：可根据行业特点调整默认阈值"
  - "词库扩展：如有新增词汇，按类别添加到对应章节"
